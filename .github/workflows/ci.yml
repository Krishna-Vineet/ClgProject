name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: campusops, POSTGRES_PASSWORD: campusops, POSTGRES_DB: campusops_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://campusops:campusops@127.0.0.1:5432/campusops_test
      TEST_DATABASE_URL: postgresql://campusops:campusops@127.0.0.1:5432/campusops_test
      JWT_ACCESS_SECRET: ci-access-secret-0123456789-0123456789
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-0123456789-0123456789
      DEMO_MODE: "true"
      EMAIL_MODE: demo
      EXPOSE_DEMO_OTP: "true"
      SEED_DEMO_PASSWORD: Ci-Only-Password-123!
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bun run test
      - run: bun run build:web
